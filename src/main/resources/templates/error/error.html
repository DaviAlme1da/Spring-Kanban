<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro — Kanban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>

    <div class="error-page">

        <!-- Ícone de alerta -->
        <div class="error-icon">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 6L4 42h40L24 6Z" fill="#f0e4d9" stroke="#C99A7C" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M24 20v10" stroke="#C99A7C" stroke-width="2" stroke-linecap="round"/>
                <circle cx="24" cy="35" r="1.5" fill="#C99A7C"/>
            </svg>
        </div>

        <!-- Código do erro (vindo do Spring) -->
        <p class="error-code" th:text="${status} ?: 'Erro'">Erro</p>

        <!-- Título -->
        <h1 class="error-title">Algo deu errado</h1>

        <!-- Mensagem da exception (se existir) -->
        <p class="error-description"
           th:text="${message} ?: 'Ocorreu um erro inesperado. Tente novamente ou entre em contato com o suporte.'">
            Ocorreu um erro inesperado.
        </p>

        <!-- Botão voltar -->
        <a th:href="@{/projects}" class="btn-home">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Voltar para o painel
        </a>

    </div>

</body>
</html>
