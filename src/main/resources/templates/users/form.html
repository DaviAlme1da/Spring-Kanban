<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${pageTitle}, ~{::content})}">

<th:block th:fragment="content">

<div class="page-topbar">
    <a th:href="@{/users}" class="btn-back">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Voltar
    </a>
</div>

<main class="main-form">
    <div class="form-card">
        <div class="form-stripe"></div>
        <div class="form-inner">
            <div class="form-header">
                <p class="form-label-top" th:text="${pageSubtitle}">Usuário</p>
                <h1 class="form-title" th:text="${pageTitle}">Criar Usuário</h1>
            </div>

            <form method="post" th:object="${UserForm}" th:action="${formAction}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="name">Nome Completo <span class="required">*</span></label>
                    <div class="input-wrap">
                        <input type="text" id="name" th:field="*{name}" class="form-control"
                               placeholder="Ex: Maria Silva" required/>
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.2"/>
                            <path d="M2 14c0-2.8 2.69-5 6-5s6 2.2 6 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <ul th:if="${#fields.hasErrors('name')}">
                        <li class="text-danger" th:each="error : ${#fields.errors('name')}" th:text="${error}"></li>
                    </ul>
                </div>

                <div class="form-group" th:if="${showPassword}">
                    <label for="password">Senha <span class="required">*</span></label>
                    <div class="input-wrap">
                        <input type="password" id="password" th:field="*{password}" class="form-control"
                               placeholder="••••••••" required/>
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
                            <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                            <circle cx="8" cy="10.5" r="1" fill="currentColor"/>
                        </svg>
                    </div>
                    <ul th:if="${#fields.hasErrors('password')}">
                        <li class="text-danger" th:each="error : ${#fields.errors('password')}" th:text="${error}"></li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="role">Nível de Acesso <span class="required">*</span></label>
                    <div class="select-wrap">
                        <select id="role" th:field="*{role}" class="form-control form-select" required>
                            <option value="">Selecione um nível de acesso</option>
                            <option th:each="r : ${T(com.project.kanban.core.enums.Role).values()}"
                                    th:value="${r}" th:text="${r}"></option>
                        </select>
                        <svg class="select-arrow" width="14" height="14" viewBox="0 0 14 14" fill="none">
                            <path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <ul th:if="${#fields.hasErrors('role')}">
                        <li class="text-danger" th:each="error : ${#fields.errors('role')}" th:text="${error}"></li>
                    </ul>
                </div>

                <button type="submit" class="btn-submit">
                    <span th:text="${submitLabel}">Salvar</span>
                    <svg class="btn-arrow" width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</main>
</th:block>
</html>
