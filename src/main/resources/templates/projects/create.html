<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Projeto</title>
</head>
<body>
    <h1>Criar Projeto</h1>

    <form method="post" th:object="${ProjectsForm}">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-group">
              <label for="name">Nome*</label>
              <input type="text" th:field="*{name}" required class="form-control">
              <ul>
                <li class="text-danger" th:each="error : ${#fields.errors('name')}" th:text="${error}">
                </li>
              </ul>
            </div>

            <div class="form-group">
              <label for="description">Descrição</label>
              <input type="text" th:field="*{description}" class="form-control">
              <ul>
                <li class="text-danger" th:each="error : ${#fields.errors('description')}" th:text="${error}">
                </li>
              </ul>
            </div>
            <button class="btn btn-primary" type="submit">Salvar</button>
    </form>
</body>
</html>
