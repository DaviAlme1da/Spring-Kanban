<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos — Kanban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="navbar">
        <div class="navbar-inner">

            <a href="/projects" class="navbar-logo">
                <span class="logo-mark">K</span>
                <span class="logo-text">Kanban</span>
            </a>

            <div class="navbar-right">

                <a href="/users" class="btn-users" sec:authorize="hasRole('ADMIN')">
                    <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
                        <circle cx="5.5" cy="4.5" r="2.5" stroke="currentColor" stroke-width="1.3"/>
                        <path d="M1 13c0-2.2 2.015-4 4.5-4s4.5 1.8 4.5 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                        <circle cx="11.5" cy="4.5" r="2" stroke="currentColor" stroke-width="1.3"/>
                        <path d="M13.5 13c0-1.8-1.12-3.3-2.7-3.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                    </svg>
                    Usuários
                </a>

                <details class="user-menu">
                    <summary class="user-summary">
                        <div class="user-avatar"
                             th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 2))}">US</div>
                        <div class="user-info-wrap">
                            <span class="user-name" sec:authentication="name">Usuário</span>
                            <span class="user-role" sec:authorize="hasRole('ADMIN')">Admin</span>
                            <span class="user-role" sec:authorize="hasRole('COMMONUSER')">Membro</span>
                        </div>
                        <svg class="chevron" width="13" height="13" viewBox="0 0 13 13" fill="none">
                            <path d="M3 5l3.5 3.5L10 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </summary>
                    <div class="user-dropdown">
                        <a href="/logout" class="user-dropdown-item danger">
                            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                                <path d="M5 2H3a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h2M9 10l3-3-3-3M12 7H5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            Sair
                        </a>
                    </div>
                </details>

            </div>
        </div>
    </header>

    <main class="main">

        <div class="page-header">
            <div class="page-header-left">
                <h1 class="page-title" sec:authorize="hasRole('COMMONUSER')">Meus projetos</h1>
                <h1 class="page-title" sec:authorize="hasRole('ADMIN')">Todos os projetos</h1>
                <span class="project-count" th:text="${projectsListem.size()} + ' projeto(s)'">0 projetos</span>
            </div>
            <a th:href="@{/projects/create}" class="btn-primary">
                <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                    <path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                Novo projeto
            </a>
        </div>

        <!-- Estado vazio -->
        <div class="empty-state" th:if="${projectsListem.empty}">
            <div class="empty-icon">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect x="2" y="2" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/>
                    <rect x="16" y="2" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/>
                    <rect x="2" y="16" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/>
                    <rect x="16" y="16" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/>
                </svg>
            </div>
            <p class="empty-title">Nenhum projeto por aqui ainda</p>
            <p class="empty-sub">Que tal começar um novo?</p>
            <a th:href="@{/projects/create}" class="btn-primary">
                <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                    <path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                Novo projeto
            </a>
        </div>

        <!-- Lista de projetos -->
        <div class="projects-grid" th:unless="${projectsListem.empty}">
            <div class="project-card" th:each="project : ${projectsListem}">

                <div class="card-accent"
                     th:classappend="${project.id % 5 == 0} ? 'accent-coral' :
                                     (${project.id % 4 == 0} ? 'accent-amber' :
                                     (${project.id % 3 == 0} ? 'accent-teal' :
                                     (${project.id % 2 == 0} ? 'accent-purple' : 'accent-blue')))">
                </div>

                <div class="card-body">
                    <div class="card-top">
                        <div class="card-avatar"
                             th:classappend="${project.id % 5 == 0} ? 'av-coral' :
                                             (${project.id % 4 == 0} ? 'av-amber' :
                                             (${project.id % 3 == 0} ? 'av-teal' :
                                             (${project.id % 2 == 0} ? 'av-purple' : 'av-blue')))"
                             th:text="${#strings.toUpperCase(#strings.substring(project.name, 0, 2))}">PR</div>

                        <div class="card-menu">
                            <button class="dots-btn" aria-label="Opções" onclick="toggleMenu(event, this)">
                                <span class="dot"></span>
                                <span class="dot"></span>
                                <span class="dot"></span>
                            </button>
                            <div class="dropdown">
                                <a th:href="@{/projects/details/{id}(id=${project.id})}" class="dropdown-item">
                                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.3"/><path d="M7 6v4M7 4.5v.01" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                                    Detalhes
                                </a>
                                <a th:href="@{/projects/edit/{id}(id=${project.id})}" class="dropdown-item">
                                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5l2 2L4 12H2v-2L9.5 2.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
                                    Editar
                                </a>
                                <a th:href="@{/projects/delete/{id}(id=${project.id})}"
                                   class="dropdown-item danger"
                                   onclick="return confirm('Tem certeza que deseja excluir este projeto?')">
                                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 3.5h10M5 3.5V2.5h4v1M5.5 6v4M8.5 6v4M3 3.5l.7 7.5h6.6L11 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    Excluir
                                </a>
                            </div>
                        </div>
                    </div>

                    <a th:href="@{/projects/{id}/tasks(id=${project.id})}" class="card-title"
                       th:text="${project.name}">Nome do Projeto</a>

                    <div class="card-meta">
                        <span class="meta-item">
                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="2" width="10" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M4 1v2M8 1v2M1 5h10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
                            <span th:text="${#temporals.format(project.startDate, 'dd/MM/yyyy')}">01/01/2026</span>
                        </span>
                        <span class="meta-dot"></span>
                        <span class="owner-tag" th:text="${project.ownerName}">Usuário</span>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <script>
        function toggleMenu(event, btn) {
            event.stopPropagation();
            const menu = btn.closest('.card-menu');
            const isOpen = menu.classList.contains('open');
            // fecha todos
            document.querySelectorAll('.card-menu.open').forEach(m => m.classList.remove('open'));
            // abre o clicado (se não estava aberto)
            if (!isOpen) menu.classList.add('open');
        }

        // fecha ao clicar fora
        document.addEventListener('click', () => {
            document.querySelectorAll('.card-menu.open').forEach(m => m.classList.remove('open'));
        });
    </script>

</body>
</html>
