<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${ProjectDetails.name} + ' — Kanban'">Detalhes do Projeto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/project-details.css}">
</head>
<body>

    <header class="navbar">
        <div class="navbar-inner">
            <a href="/projects" class="navbar-logo">
                <span class="logo-mark">K</span>
                <span class="logo-text">Kanban</span>
            </a>
            <a th:href="@{/projects}" class="btn-back">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Voltar
            </a>
        </div>
    </header>

    <main class="main">
        <div class="doc-card">

            <div class="doc-stripe"></div>

            <div class="doc-inner">

                <!-- Cabeçalho: título + botão kanban -->
                <div class="doc-header">
                    <div class="doc-header-left">
                        <p class="doc-label">Detalhes do projeto</p>
                        <h1 class="doc-title" th:text="${ProjectDetails.name}">Nome do Projeto</h1>
                    </div>
                </div>

                <!-- Metadados -->
                <div class="doc-meta">
                    <div class="meta-item">
                        <div class="meta-icon">
                            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                                <circle cx="7" cy="4.5" r="2.5" stroke="currentColor" stroke-width="1.3"/>
                                <path d="M1.5 13c0-2.5 2.46-4.5 5.5-4.5s5.5 2 5.5 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="meta-text">
                            <span class="meta-label">Criado por</span>
                            <span class="meta-value" th:text="${ProjectDetails.ownerName}">Usuário</span>
                        </div>
                    </div>

                    <div class="meta-divider"></div>

                    <div class="meta-item">
                        <div class="meta-icon">
                            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                                <rect x="1" y="2.5" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                                <path d="M4 1v3M10 1v3M1 6h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="meta-text">
                            <span class="meta-label">Data de início</span>
                            <span class="meta-value"
                                  th:text="${#temporals.format(ProjectDetails.startDate, 'dd/MM/yyyy')}">01/01/2026</span>
                        </div>
                    </div>
                </div>

                <!-- Descrição -->
                <p class="doc-section-label">Descrição</p>
                <p class="doc-description" th:text="${ProjectDetails.description}">
                    Descrição detalhada do projeto aparece aqui.
                </p>

                <!-- Footer -->
                <div class="doc-footer">
                    <a th:href="@{/projects/{id}/tasks(id=${ProjectDetails.id})}" class="btn-kanban-footer">
                        Acessar Quadro Kanban
                        <svg class="btn-arrow" width="14" height="14" viewBox="0 0 14 14" fill="none">
                            <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
