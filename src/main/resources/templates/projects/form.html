<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: layout(${pageTitle}, ~{::content})}">

<title th:text="${pageTitle} + ' — Kanban'">Projeto</title>

<th:block th:fragment="content">
    <main class="main-form">
        <div class="form-card">

            <div class="form-stripe"></div>

            <div class="form-inner">
                <form method="post" th:object="${ProjectsForm}">
                    <div class="form-header">
                        <p class="form-label-top" th:text="${pageSubtitle}">Projeto</p>
                        <h1 class="form-title" th:text="${pageTitle}">Criar Projeto</h1>
                    </div>

                    <form method="post" th:object="${ProjectsForm}" th:action="${formAction}">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="form-group">
                            <label for="name">
                                Nome do Projeto
                                <span class="required">*</span>
                            </label>
                            <div class="input-wrap">
                                <input type="text" id="name" th:field="*{name}" class="form-control"
                                    placeholder="Ex: Website Redesign" required />
                                <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                                    <rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor"
                                        stroke-width="1.2" />
                                    <path d="M5 7h6M5 10h4" stroke="currentColor" stroke-width="1.2"
                                        stroke-linecap="round" />
                                </svg>
                            </div>
                            <ul th:if="${#fields.hasErrors('name')}">
                                <li class="text-danger" th:each="error : ${#fields.errors('name')}" th:text="${error}">
                                </li>
                            </ul>
                        </div>

                        <div class="form-group">
                            <label for="description">Descrição</label>
                            <textarea id="description" th:field="*{description}" class="form-control"
                                placeholder="Descreva o objetivo do projeto..."></textarea>
                            <ul th:if="${#fields.hasErrors('description')}">
                                <li class="text-danger" th:each="error : ${#fields.errors('description')}"
                                    th:text="${error}"></li>
                            </ul>
                        </div>

                        <button type="submit" class="btn-submit">
                            <span th:text="${submitLabel}">Salvar</span>
                            <svg class="btn-arrow" width="14" height="14" viewBox="0 0 14 14" fill="none">
                                <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.4"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>

                    </form>
            </div>
        </div>
    </main>
</th:block>

</html>
