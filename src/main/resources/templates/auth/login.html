<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Kanban</title>

    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2388A085'/><path d='M16 4C16 4 8 9 8 17C8 21.4 11.6 25 16 25C20.4 25 24 21.4 24 17C24 9 16 4 16 4Z' fill='white' opacity='0.9'/><path d='M16 25V17' stroke='white' stroke-width='1.5' stroke-linecap='round'/></svg>" type="image/svg+xml">

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>
    <div class="bg-shape bg-shape-3"></div>
    <div class="dot-grid"></div>

    <div class="card">
        <div class="card-header">
            <div class="brand-mark">
                <div class="brand-dot"></div>
                <span class="brand-label">Acesso seguro</span>
            </div>
            <h1 class="card-title">Bem-vindo <em>de volta</em></h1>
            <p class="card-subtitle">Entre com suas credenciais para continuar</p>
        </div>

        
        <div class="login-error" th:if="${param.error}">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M7 4.5v3M7 9.5v.01" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            Usuário ou senha incorretos. Tente novamente.
        </div>

        <form th:action="@{/auth/login}" method="post">

            <div class="field">
                <label for="username">Usuário</label>
                <div class="input-wrap">
                    <input type="text" id="username" name="username"
                           placeholder="digite seu nome de usuário"
                           autocomplete="username"
                           th:classappend="${param.error} ? 'input-error'"/>
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M2 4.5C2 3.67 2.67 3 3.5 3h9C13.33 3 14 3.67 14 4.5v7c0 .83-.67 1.5-1.5 1.5h-9C2.67 13 2 12.33 2 11.5v-7Z" stroke="currentColor" stroke-width="1.2"/>
                        <path d="M2 5l6 4 6-4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>

            <div class="field">
                <label for="password">Senha</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password"
                           placeholder="••••••••"
                           autocomplete="current-password"
                           th:classappend="${param.error} ? 'input-error'"/>
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
                        <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                        <circle cx="8" cy="10.5" r="1" fill="currentColor"/>
                    </svg>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                Entrar
                <svg class="btn-arrow" viewBox="0 0 16 16" fill="none">
                    <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

        </form>
    </div>

</body>
</html>
