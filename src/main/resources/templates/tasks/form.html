<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${pageTitle}, ~{::content})}">

<th:block th:fragment="content">

<div class="page-topbar">
    <a th:href="@{/projects/{id}/tasks(id=${idProject})}" class="btn-back">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Voltar
    </a>
</div>

<main class="main-form">
    <div class="form-card">
        <div class="form-stripe"></div>
        <div class="form-inner">
            <div class="form-header">
                <p class="form-label-top" th:text="${pageSubtitle}">Tarefa</p>
                <h1 class="form-title" th:text="${pageTitle}">Criar Tarefa</h1>
            </div>

            <form method="post" th:object="${TaksForm}" th:action="${formAction}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="title">Nome da Tarefa <span class="required">*</span></label>
                    <div class="input-wrap">
                        <input type="text" id="title" th:field="*{title}" class="form-control"
                               placeholder="Ex: Revisar código do header" required/>
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M3 4h10M3 8h7M3 12h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <ul th:if="${#fields.hasErrors('title')}">
                        <li class="text-danger" th:each="error : ${#fields.errors('title')}" th:text="${error}"></li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="description">Descrição</label>
                    <textarea id="description" th:field="*{description}" class="form-control"
                              placeholder="Detalhes sobre o que precisa ser feito..."></textarea>
                    <ul th:if="${#fields.hasErrors('description')}">
                        <li class="text-danger" th:each="error : ${#fields.errors('description')}" th:text="${error}"></li>
                    </ul>
                </div>

                <button type="submit" class="btn-submit">
                    <span th:text="${submitLabel}">Salvar</span>
                    <svg class="btn-arrow" width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</main>
</th:block>
</html>
