<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/task-index.css}">
</head>
<body>

    <header class="navbar">
        <div class="navbar-inner">

            <a href="/projects" class="navbar-logo">
                <span class="logo-mark">K</span>
                <span class="logo-text">Kanban</span>
            </a>

            <div class="navbar-center">
                <span class="project-name">Quadro de Tarefas</span>
                <span class="project-sub">Projeto #<span th:text="${idProject}">1</span></span>
            </div>

            <div class="navbar-right">
                <a th:href="@{/projects}" class="btn-back">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Projetos
                </a>
                <a th:href="@{/projects/{id}/tasks/create(id=${idProject})}" class="btn-new-task">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                        <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Nova Task
                </a>
            </div>

        </div>
    </header>

    <main class="main">
        <div class="kanban-board">

            <!-- ═══════════════ TODO ═══════════════ -->
            <div class="kanban-column col-todo">
                <div class="column-header">
                    <div class="column-title-wrap">
                        <span class="column-dot"></span>
                        <span class="column-title">A Fazer</span>
                    </div>
                    <span class="column-count"
                          th:text="${#lists.size(TasksListItem.?[status.name() == 'TODO'])}">0</span>
                </div>
                <div class="column-body">

                    <div th:each="task : ${TasksListItem}" th:if="${task.status.name() == 'TODO'}">
                        <div class="task-card">
                            <span class="task-title" th:text="${task.title}">Título da tarefa</span>
                            <div class="task-footer">
                                <a class="btn-details"
                                   th:href="@{/projects/{idProject}/tasks/details/{idTask}(idProject=${task.idProject}, idTask=${task.idTask})}">
                                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                                        <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.2"/>
                                        <path d="M6 5v3M6 3.8v.01" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                                    </svg>
                                    Detalhes
                                </a>
                                <div class="task-actions">
                                    <a class="btn-move"
                                       title="Mover para Em Execução"
                                       th:href="@{/projects/{idProject}/tasks/moveToNextStatus/{idTask}(idProject=${task.idProject}, idTask=${task.idTask})}">
                                        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                                            <path d="M3 6.5h7M7 3l3.5 3.5L7 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Vazio -->
                    <div class="column-empty"
                         th:if="${#lists.isEmpty(TasksListItem.?[status.name() == 'TODO'])}">
                        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                            <rect x="2" y="2" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.3"/>
                            <rect x="12" y="2" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.3"/>
                            <rect x="2" y="12" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.3"/>
                            <rect x="12" y="12" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.3"/>
                        </svg>
                        Nenhuma tarefa aqui
                    </div>

                </div>
            </div>

            <!-- ═══════════════ DOING ═══════════════ -->
            <div class="kanban-column col-doing">
                <div class="column-header">
                    <div class="column-title-wrap">
                        <span class="column-dot"></span>
                        <span class="column-title">Em Execução</span>
                    </div>
                    <span class="column-count"
                          th:text="${#lists.size(TasksListItem.?[status.name() == 'DOING'])}">0</span>
                </div>
                <div class="column-body">

                    <div th:each="task : ${TasksListItem}" th:if="${task.status.name() == 'DOING'}">
                        <div class="task-card">
                            <span class="task-title" th:text="${task.title}">Título da tarefa</span>
                            <div class="task-footer">
                                <a class="btn-details"
                                   th:href="@{/projects/{idProject}/tasks/details/{idTask}(idProject=${task.idProject}, idTask=${task.idTask})}">
                                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                                        <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.2"/>
                                        <path d="M6 5v3M6 3.8v.01" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                                    </svg>
                                    Detalhes
                                </a>
                                <div class="task-actions">
                                    <a class="btn-move"
                                       title="Voltar para A Fazer"
                                       th:href="@{/projects/{idProject}/tasks/moveToPreviousStatus/{idTask}(idProject=${task.idProject}, idTask=${task.idTask})}">
                                        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                                            <path d="M10 6.5H3M6 3L2.5 6.5 6 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </a>
                                    <a class="btn-move"
                                       title="Mover para Concluído"
                                       th:href="@{/projects/{idProject}/tasks/moveToNextStatus/{idTask}(idProject=${task.idProject}, idTask=${task.idTask})}">
                                        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                                            <path d="M3 6.5h7M7 3l3.5 3.5L7 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Vazio -->
                    <div class="column-empty"
                         th:if="${#lists.isEmpty(TasksListItem.?[status.name() == 'DOING'])}">
                        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                            <rect x="2" y="2" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.3"/>
                            <rect x="12" y="2" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.3"/>
                            <rect x="2" y="12" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.3"/>
                            <rect x="12" y="12" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.3"/>
                        </svg>
                        Nenhuma tarefa aqui
                    </div>

                </div>
            </div>

            <!-- ═══════════════ DONE ═══════════════ -->
            <div class="kanban-column col-done">
                <div class="column-header">
                    <div class="column-title-wrap">
                        <span class="column-dot"></span>
                        <span class="column-title">Concluído</span>
                    </div>
                    <span class="column-count"
                          th:text="${#lists.size(TasksListItem.?[status.name() == 'DONE'])}">0</span>
                </div>
                <div class="column-body">

                    <div th:each="task : ${TasksListItem}" th:if="${task.status.name() == 'DONE'}">
                        <div class="task-card">
                            <span class="task-title" th:text="${task.title}">Título da tarefa</span>
                            <div class="task-footer">
                                <a class="btn-details"
                                   th:href="@{/projects/{idProject}/tasks/details/{idTask}(idProject=${task.idProject}, idTask=${task.idTask})}">
                                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                                        <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.2"/>
                                        <path d="M6 5v3M6 3.8v.01" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                                    </svg>
                                    Detalhes
                                </a>
                                <div class="task-actions">
                                    <a class="btn-move"
                                       title="Voltar para Em Execução"
                                       th:href="@{/projects/{idProject}/tasks/moveToPreviousStatus/{idTask}(idProject=${task.idProject}, idTask=${task.idTask})}">
                                        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                                            <path d="M10 6.5H3M6 3L2.5 6.5 6 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Vazio -->
                    <div class="column-empty"
                         th:if="${#lists.isEmpty(TasksListItem.?[status.name() == 'DONE'])}">
                        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                            <rect x="2" y="2" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.3"/>
                            <rect x="12" y="2" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.3"/>
                            <rect x="2" y="12" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.3"/>
                            <rect x="12" y="12" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.3"/>
                        </svg>
                        Nenhuma tarefa aqui
                    </div>

                </div>
            </div>

        </div>
    </main>

</body>
</html>
