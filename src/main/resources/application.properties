
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/projectKanban?useSSL=false&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.show-sql=false

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

br.com.treinaweb.twprojects.mappers.provider=modelmapper

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# configuração do email

# qual sevidor SMTP
spring.mail.host=smtp-relay.brevo.com

# porta do servidor
spring.mail.port=587

# qual é o username do servido
spring.mail.username=${USERNAME_EMAIL}

# qual é senha do servido
spring.mail.password=${PASSWORD_EMAIL}

# fazer a autentificação da comunicação
spring.mail.properties.mail.smtp.auth=true

# aumentar a segurança na comunicação atraves da rede (em ambiente de produção é bem importante)
spring.mail.properties.mail.smtp.starttls.enable=true
